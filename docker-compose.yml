services:
  mcp-client-glpi:
    container_name: mcp-client-glpi
    image: mcp-client-glpi:${APP_VERSION:-latest}
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
